<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missão Solo Seguro</title>
<meta name="description" content="Jogo investigativo para o Técnico em Meio Ambiente: aparência não garante qualidade do solo. Estudo de caso do Assentamento Pastorinhas (Brumadinho/MG) com VRQ, VP e VI da CONAMA 420/2009.">
<meta name="theme-color" content="#17201a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317201a'/%3E%3Crect x='4' y='9' width='24' height='5' fill='%23b4532a'/%3E%3Crect x='4' y='14' width='24' height='6' fill='%235a3d2b'/%3E%3Crect x='4' y='20' width='24' height='6' fill='%238a6a45'/%3E%3Cpath d='M16 4v10' stroke='%23f1f4ee' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="app" id="app">

  <!-- Barra de status do jogo -->
  <header class="hud" id="hud" hidden>
    <div class="hud-id">
      <span class="hud-label">Técnica(o)</span>
      <strong id="hud-nome">—</strong>
    </div>
    <div class="hud-fase">
      <span class="hud-label" id="hud-fase-label">Fase</span>
      <ol class="trilha" id="hud-trilha" aria-label="Progresso nas fases"></ol>
    </div>
    <div class="hud-xp">
      <span class="hud-label">XP</span>
      <strong id="hud-xp" class="num">0</strong>
    </div>
    <div class="hud-conf" title="Confiança da comunidade no seu trabalho técnico">
      <span class="hud-label"><span class="longo">Confiança da comunidade</span><span class="curto">Confiança</span></span>
      <div class="barra" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="hud-conf-meter">
        <span id="hud-conf-fill"></span>
      </div>
    </div>
    <div class="hud-medalhas" id="hud-medalhas" aria-label="Medalhas conquistadas"></div>
  </header>

  <!-- Controles de áudio (sempre visíveis) -->
  <div class="som" role="group" aria-label="Controles de áudio">
    <button type="button" class="som-btn" id="btn-musica" aria-pressed="true" title="Música de fundo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg>
      <span class="sr">Música</span>
    </button>
    <button type="button" class="som-btn" id="btn-efeitos" aria-pressed="true" title="Efeitos sonoros">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr">Efeitos</span>
    </button>
    <button type="button" class="som-btn" id="btn-narracao" aria-pressed="false" title="Narração por voz (leitura dos textos)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr">Narração</span>
    </button>
  </div>

  <main class="palco" id="palco" tabindex="-1">
    <!-- As telas são montadas por js/jogo.js -->
    <noscript><p class="noscript">Este jogo precisa de JavaScript ativado no navegador.</p></noscript>
  </main>

  <footer class="rodape">
    <span>Técnico em Meio Ambiente · Normas CETESB · Aula 1: Parâmetros da qualidade do solo</span>
    <button type="button" class="link-btn" id="btn-guia">Guia do professor</button>
  </footer>
</div>

<!-- Guia do professor -->
<div class="modal" id="modal-guia" hidden>
  <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="guia-titulo">
    <button type="button" class="modal-fechar" id="guia-fechar" aria-label="Fechar guia">×</button>
    <div id="guia-conteudo"></div>
  </div>
</div>

<canvas id="folhas" aria-hidden="true"></canvas>
<div class="aviso-voz" id="aviso" role="status" aria-live="polite"></div>

<script src="js/conteudo.js"></script>
<script src="js/audio.js"></script>
<script src="js/cenas.js"></script>
<script src="js/jogo.js"></script>
</body>
</html>
